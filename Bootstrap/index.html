<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Code below this line should not be changed -->
    <div class="terminal">
        <header class="terminal-header">
            <div class="window-controls">
                <span class="control close"></span>
                <span class="control minimize"></span>
                <span class="control maximize"></span>
            </div>
            <div class="title-bar">
                <span class="prompt">></span>
                <span class="title">JQUERY_PLAYGROUND</span>
                <span class="cursor">_</span>
            </div>
        </header>

        <main class="terminal-body">
            <div class="app-header">
                <h1 class="app-title">~/development/jquery_playground</h1>
                <div class="status-bar">
                    <span class="status-item">BOOTSTRAP_v5</span>
                    <span class="status-item">jQuery_v3</span>
                    <span class="status-item">ACTIVE</span>
                </div>
            </div>

            <div class="container-fluid">
                <h3 class="text-primary text-center">jQuery Playground</h3>
                <div class="row">
                    <div class="col-xs-6">
                        <h4>#left-well</h4>
                        <div class="well" id="left-well">
                            <button class="btn btn-default target" id="target1">#target1</button>
                            <button class="btn btn-default target" id="target2">#target2</button>
                            <button class="btn btn-default target" id="target3">#target3</button>
                        </div>
                    </div>
                    <div class="col-xs-6">
                        <h4>#right-well</h4>
                        <div class="well" id="right-well">
                            <button class="btn btn-default target" id="target4">#target4</button>
                            <button class="btn btn-default target" id="target5">#target5</button>
                            <button class="btn btn-default target" id="target6">#target6</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-header">
                    <span class="info-title">BUTTON_STATISTICS</span>
                </div>
                <div class="info-content">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="total-clicks">0</span>
                            <span class="stat-label">TOTAL_CLICKS</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="active-buttons">6</span>
                            <span class="stat-label">ACTIVE_BUTTONS</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="last-target">none</span>
                            <span class="stat-label">LAST_TARGET</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">v1.0</span>
                            <span class="stat-label">VERSION</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="terminal-footer">
            <div class="footer-stats">
                <span class="stat">STATUS: <span class="highlight">MONITORING</span></span>
                <span class="stat">CLICKS: <span class="highlight" id="footer-clicks">0</span></span>
                <span class="stat">MODE: <span class="highlight">INTERACTIVE</span></span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
